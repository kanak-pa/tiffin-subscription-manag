<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyBite - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; margin:0; padding: 30px 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-paused { background: #fef3c7; color: #92400e; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #10b981; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 6px 0 12px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Welcome, <span id="userName">User</span>!</h2>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <div class="card">
        <h3>Subscription Status</h3>
        <p><strong>Subscription ID:</strong> #<span id="subId">--</span></p>
        <p><strong>Status:</strong> <span id="statusBadge">Loading...</span></p>
        <a href="/bill" class="btn btn-primary" style="margin-top: 10px;">📄 View Current Due Bill</a>
    </div>

    <div class="card">
        <h3>Manage Delivery Pauses</h3>
        <label>Pause Start Date</label>
        <input type="date" id="pauseStart">
        <label>Pause End Date</label>
        <input type="date" id="pauseEnd">
        
        <div style="display:flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-warning" style="flex:1;" onclick="pauseSub()">Pause Delivery</button>
            <button class="btn btn-primary" style="flex:1;" onclick="resumeSub()">Resume Delivery</button>
        </div>
        <p id="actionMsg" style="margin-top:12px; font-weight:600;"></p>
    </div>
</div>

<script>
    let user = null;

    window.onload = async function() {
        const stored = localStorage.getItem('currentUser');
        if (!stored) {
            window.location.href = '/login';
            return;
        }
        user = JSON.parse(stored);
        document.getElementById('userName').innerText = user.name;
        document.getElementById('subId').innerText = user.subscription_id;

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('pauseStart').value = today;
        document.getElementById('pauseEnd').value = today;

        await loadSubscriptionStatus();
    };

    async function loadSubscriptionStatus() {
        const res = await fetch(`/api/v1/subscriptions/${user.subscription_id}`);
        const data = await res.json();
        const badge = document.getElementById('statusBadge');
        if (data.status === 'ACTIVE') {
            badge.className = 'badge badge-active';
            badge.innerText = 'ACTIVE';
        } else {
            badge.className = 'badge badge-paused';
            badge.innerText = 'PAUSED';
        }
    }

    async function pauseSub() {
        const start = document.getElementById('pauseStart').value;
        const end = document.getElementById('pauseEnd').value;
        const res = await fetch(`/api/v1/subscriptions/${user.subscription_id}/pause`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ pause_start: start, pause_end: end })
        });
        const data = await res.json();
        document.getElementById('actionMsg').innerText = data.message;
        await loadSubscriptionStatus();
    }

    async function resumeSub() {
        const res = await fetch(`/api/v1/subscriptions/${user.subscription_id}/resume`, { method: 'POST' });
        const data = await res.json();
        document.getElementById('actionMsg').innerText = data.message;
        await loadSubscriptionStatus();
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login';
    }
</script>
</body>
</html>
