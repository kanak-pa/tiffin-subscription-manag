<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyBite - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; margin:0; padding: 40px 15px; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        h1 { text-align: center; font-size: 1.6rem; color: #10b981; margin-bottom: 24px; }
        .tab-btn { width: 48%; padding: 10px; font-weight: 600; border: none; background: #e2e8f0; border-radius: 6px; cursor: pointer; }
        .tab-active { background: #10b981; color: white; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 6px; color: #64748b; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button.submit { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: 700; margin-top: 18px; cursor: pointer; }
        button.submit:hover { background: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍱 DailyBite Tiffin</h1>
    <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
        <button class="tab-btn tab-active" id="loginTab" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="regTab" onclick="switchTab('reg')">Register</button>
    </div>

    <div id="loginForm">
        <label>Registered Phone Number</label>
        <input type="text" id="loginPhone" placeholder="9876543210">
        <button class="submit" onclick="login()">Sign In To Dashboard</button>
    </div>

    <div id="regForm" style="display:none;">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Rahul Sharma">
        <label>Phone Number</label>
        <input type="text" id="regPhone" placeholder="9876543210">
        <button class="submit" onclick="register()">Create Profile & Sign In</button>
    </div>
</div>

<script>
    function switchTab(tab) {
        if (tab === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('regForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('tab-active');
            document.getElementById('regTab').classList.remove('tab-active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('regForm').style.display = 'block';
            document.getElementById('regTab').classList.add('tab-active');
            document.getElementById('loginTab').classList.remove('tab-active');
        }
    }

    async function login() {
        const phone = document.getElementById('loginPhone').value;
        if (!phone) return alert("Enter phone number");

        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ phone })
        });
        const data = await res.json();
        if (res.ok) {
            localStorage.setItem('currentUser', JSON.stringify(data));
            window.location.href = '/dashboard';
        } else {
            alert(data.detail || "Sign in failed");
        }
    }

    async function register() {
        const name = document.getElementById('regName').value;
        const phone = document.getElementById('regPhone').value;
        if (!name || !phone) return alert("Enter name and phone number");

        const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, phone })
        });
        const data = await res.json();
        if (res.ok) {
            alert("Profile created!");
            document.getElementById('loginPhone').value = phone;
            login();
        } else {
            alert(data.detail || "Registration failed");
        }
    }
</script>
</body>
</html>
